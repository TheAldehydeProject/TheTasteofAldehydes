<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test page 5 — The Taste of Aldehydes</title>
<!-- SEARCH ENGINES: begin — what a search engine and a shared link show of this page. -->
<meta name="description" content="A test page, not a part of the site: The Perfumers, a Sketchbook — every perfumer, house and perfume in schedules, on a sheet of sketched perfume bottles.">
<link rel="canonical" href="https://thetasteofaldehydes.com/test-pages/5/">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../favicon.svg?v=2026-10-05" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2026-10-05">
<meta name="theme-color" content="#050505">
<!-- SEARCH ENGINES: end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Caveat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  TEST PAGE 5 — THE PERFUMERS, A SKETCHBOOK (2026-11-06). The owner: "please
  also generate a 5th test page (by moving all the other ones a little to
  the left on the contacts page), modelled like the image attached
  (architecture sketch) that is going to be another page that attempts to
  house the perfumer information." The picture: white pencil and chalk on
  black, outlines traced over, construction lines, notes in a hand, plans
  in a corner, details boxed at the foot, a title in a box. A section of
  houses first; then a flacon drawn from every perfumer ("make designs of
  perfume bottles that look like sketches"); and then, the same day: "id
  rather have just the design of the page be like that, no need to make it
  involved with the function of the page ... Also redesign it." So the
  sketched flacons are the page's design, and say nothing of the ledger;
  the perfumers are its schedules — page.js says how.

  NOT A PAGE OF THE SITE: nothing on the site links here but the unseen
  squares at the foot of Contact; it loads none of the site's scripts or its
  stylesheet, is in no menu, search or sitemap, and tells search engines to
  leave it alone. Everything it needs is in this folder.
-->
<style>
  :root { --ink: #f2f2ee; --muted: rgba(242, 242, 238, 0.6); --faint: rgba(242, 242, 238, 0.24); --rule: rgba(242, 242, 238, 0.14); --hand: "Caveat", "Segoe Print", cursive; --mono: "IBM Plex Mono", ui-monospace, monospace; --sans: "Archivo", "Segoe UI", sans-serif; --serif: Georgia, "Times New Roman", serif; --side: 300px; --gap: 28px; --split: 60vh; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #050505; color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .t5-grain { position: fixed; inset: -60%; pointer-events: none; opacity: 0.06; mix-blend-mode: screen; animation: t5-grain 1.2s steps(5) infinite; z-index: 3; }
  @keyframes t5-grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-5%, 3%); } 50% { transform: translate(4%, -5%); } 75% { transform: translate(-2%, 6%); } 100% { transform: translate(0, 0); } }
  .t5 { position: fixed; inset: 0; }
  .t5-back { position: absolute; top: 20px; left: var(--gap); font: 500 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-decoration: none; z-index: 2; }
  .t5-back:hover { color: var(--ink); }
  /* THE TITLE, in a box, as the picture's */
  .t5-title { position: absolute; top: 46px; left: var(--gap); margin: 0; padding: 4px 9px 6px; font: 400 15px/1.2 var(--serif); letter-spacing: 0.01em; background: rgba(32, 32, 32, 0.92); border-bottom: 1px solid var(--ink); z-index: 2; }
  /* THE DESIGN: the sheet of flacons, at the top right */
  .t5-stage { position: absolute; left: calc(var(--side) + var(--gap) * 2); right: var(--gap); top: 14px; height: calc(var(--split) - 14px); }
  .t5-scene { display: block; }
  /* THE SCHEDULES: boxes ruled as a drawing's are */
  .t5-box { position: absolute; display: flex; flex-direction: column; border: 1px solid var(--faint); background: rgba(5, 5, 5, 0.86); min-height: 0; }
  .t5-box-head { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--faint); font: 500 9.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .t5-box-head b { font-weight: 500; color: var(--ink); }
  .t5-box-scroll { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .t5-schedule { left: var(--gap); top: 92px; bottom: var(--gap); width: var(--side); }
  .t5-find { flex: none; margin: 8px 10px 4px; padding: 6px 8px; font: 400 15px var(--hand); color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--faint); border-radius: 0; outline: none; }
  .t5-find::placeholder { color: var(--muted); }
  .t5-find:focus { border-bottom-color: var(--ink); }
  .t5-box table { width: 100%; border-collapse: collapse; }
  .t5-box thead th { position: sticky; top: 0; z-index: 1; background: #070707; padding: 6px 8px; border-bottom: 1px solid var(--faint); text-align: left; font: 500 9px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .t5-box td, .t5-box tbody th { padding: 5px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: baseline; font: 400 11px var(--mono); color: var(--muted); }
  .t5-box tbody th { font-weight: 400; }
  .t5-box tbody th button { font: 400 17px/1.05 var(--hand); color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .t5-box tbody tr { cursor: pointer; }
  .t5-box tbody tr:hover th button { text-decoration: underline; text-underline-offset: 3px; }
  .t5-box tbody tr.is-on { background: rgba(242, 242, 238, 0.08); }
  .t5-box tbody tr.is-on th button { text-decoration: underline; text-underline-offset: 3px; }
  .t5-box td:nth-last-child(-n+2) { text-align: right; }
  .t5-schedule td:first-child, .t5-perfumes td:first-child { width: 3.5em; }
  .t5-none { font: 400 15px var(--hand) !important; }
  /* THE SPECIFICATION and THE SCHEDULE OF PERFUMES, along the foot */
  .t5-spec { left: calc(var(--side) + var(--gap) * 2); top: calc(var(--split) + 10px); bottom: var(--gap); width: calc((100vw - var(--side) - var(--gap) * 4) * 0.42); }
  .t5-spec.is-on { border-color: var(--muted); }
  .t5-perfumes { right: var(--gap); top: calc(var(--split) + 10px); bottom: var(--gap); width: calc((100vw - var(--side) - var(--gap) * 4) * 0.58 - var(--gap)); }
  .t5-spec-body { padding: 8px 12px 12px; }
  .t5-spec h2 { margin: 2px 0 8px; font: 600 26px/1.05 var(--hand); }
  .t5-dl { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 14px; justify-content: start; margin: 0 0 8px; }
  .t5-dl dt { font: 500 9px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); grid-row: 1; }
  .t5-dl dd { margin: 0; font: 400 17px var(--hand); grid-row: 2; }
  .t5-credit { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 8px; font: 400 15px var(--hand); color: var(--muted); }
  .t5-credit b { font: 400 11px var(--mono); color: var(--ink); }
  .t5-k { margin: 8px 0 4px; font: 500 9px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .t5-k span { text-transform: none; letter-spacing: 0; font: 400 13px var(--hand); }
  .t5-houses { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
  .t5-houses li { display: flex; align-items: baseline; gap: 6px; padding: 2px 8px 3px; border: 1px solid var(--faint); }
  .t5-houses button { font: 400 16px var(--hand); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; }
  .t5-houses li:has(button[aria-pressed="true"]) { border-color: var(--ink); background: rgba(242, 242, 238, 0.1); }
  .t5-houses i { font: 400 10px var(--mono); font-style: normal; color: var(--muted); }
  .t5-say { margin: 0 0 6px; font: 400 15px/1.25 var(--hand); color: rgba(242, 242, 238, 0.82); }
  .t5-house-say { color: var(--ink); }
  .t5-more td { padding: 2px 8px 8px; font: 400 14px/1.25 var(--hand) !important; color: rgba(242, 242, 238, 0.82) !important; text-align: left !important; }
  .t5-perfumes td:last-child { font-size: 12px; color: var(--ink); }
  .t5-tag { position: absolute; right: var(--gap); bottom: 6px; margin: 0; font: 400 9px var(--mono); letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; }
  @media (max-width: 1100px) { :root { --side: 240px; --gap: 22px; } .t5-dl { grid-template-columns: repeat(2, auto); } .t5-dl dt, .t5-dl dd { grid-row: auto; } }
  @media (max-width: 760px) {
    body { overflow: auto; }
    .t5 { position: relative; inset: auto; padding: 0 12px 28px; }
    .t5-back { position: static; display: inline-block; margin: 16px 0 10px; }
    .t5-title { position: static; display: inline-block; font-size: 13px; }
    .t5-stage { position: relative; left: auto; right: auto; top: auto; height: 46vh; margin: 8px -12px 0; }
    .t5-box { position: relative; left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; width: auto !important; margin-top: 14px; }
    .t5-schedule .t5-box-scroll { max-height: 46vh; }
    .t5-perfumes .t5-box-scroll { max-height: 60vh; }
    .t5-spec-body { max-height: none; }
    .t5-dl { grid-template-columns: repeat(2, auto); } .t5-dl dt, .t5-dl dd { grid-row: auto; }
    .t5-tag { position: static; display: block; margin-top: 12px; }
    .t5-perfumes th:first-child, .t5-perfumes td:first-child { display: none; }
    .t5-box tbody th button { font-size: 15.5px; }
    .t5-box td, .t5-box tbody th { padding: 5px 6px; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .t5-grain { animation: none; } }
</style>
</head>
<body>
<div class="t5-grain" aria-hidden="true"></div>
<main class="t5">
  <a class="t5-back" href="../../contact/">← Back</a>
  <h1 class="t5-title">First Iteration: The Perfumers, a Sketchbook</h1>
  <div class="t5-stage"><canvas class="t5-scene" aria-hidden="true"></canvas></div>
  <section class="t5-box t5-schedule" aria-label="The perfumer schedule">
    <p class="t5-box-head"><b>Perfumer schedule</b><span data-v="shown">24 perfumers</span></p>
    <input class="t5-find" type="search" placeholder="find a perfumer, a house, a perfume" aria-label="Find a perfumer, a house or a perfume" autocomplete="off" spellcheck="false">
    <div class="t5-box-scroll">
      <table><thead><tr><th scope="col">No.</th><th scope="col">Perfumer</th><th scope="col">Houses</th><th scope="col">Perf.</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
  <section class="t5-box t5-spec" aria-live="polite" aria-label="The specification of the perfumer chosen">
    <p class="t5-box-head"><b>Specification</b><span data-v="spec-no">—</span></p>
    <div class="t5-box-scroll"><div class="t5-spec-body"></div></div>
  </section>
  <section class="t5-box t5-perfumes" aria-label="The schedule of perfumes">
    <p class="t5-box-head"><b>Schedule of perfumes</b><span><span data-v="perf-say">Every perfume</span> · <span data-v="perf-n">280</span> · ● named · ○ the house's · × not found</span></p>
    <div class="t5-box-scroll">
      <table><thead></thead><tbody></tbody></table>
    </div>
  </section>
  <p class="t5-tag">TTA · test page 05 · from the site's Perfumers ledger</p>
</main>
<script src="page.js?v=6050b1dc0d"></script>
</body>
</html>
