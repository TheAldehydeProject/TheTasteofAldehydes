<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test page 4 — The Taste of Aldehydes</title>
<!-- SEARCH ENGINES: begin — what a search engine and a shared link show of this page. -->
<meta name="description" content="A test page, not a part of the site: The Perfumers&#x27; Graph — every perfumer, house, perfume, letter and note a node, in clouds, chosen from a table.">
<link rel="canonical" href="https://thetasteofaldehydes.com/test-pages/4/">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../favicon.svg?v=2026-10-05" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2026-10-05">
<meta name="theme-color" content="#c9cbce">
<!-- SEARCH ENGINES: end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  TEST PAGE 4 — THE PERFUMERS' GRAPH (2026-11-06; "The Scent Landscape"
  stood here from 2026-11-03, and the Network Map before it). The owner:
  "replace tp4 with another iteration of the perfumers page, and this one
  should be something like images 5 and 6. It should have a table where you
  can select the perfumers and then it would take you to a node, which
  would have subnodes of houses, then further subnodes of perfumes."
  Image 5: a network of dark specks on pale grey in a camera's corners —
  OBJECT at the top, a word spelled down the left letter by letter, STAGE 5:
  LETTERS, TOTAL. Image 6: a graph view, a round field of nodes and fans.
  Made dense the same day — "that looks ugly, try to make it as close to
  the reference i have given you earlier as possible, not just a few
  lines": every letter of every perfume's name a node, and every note, a
  cloud for every perfumer, in three dimensions.

  NOT A PAGE OF THE SITE: nothing on the site links here but the
  unseen squares at the foot of Contact; it loads none of the site's
  scripts or its stylesheet, is in no menu, search or sitemap, and tells
  search engines to leave it alone. Everything it needs is in this folder.
-->
<style>
  :root { --ink: #16171a; --muted: rgba(22, 23, 26, 0.58); --line: rgba(22, 23, 26, 0.18); --panel: rgba(232, 234, 237, 0.42); --head: rgba(214, 217, 221, 0.96); --mono: "IBM Plex Mono", ui-monospace, monospace; --sans: "Archivo", "Segoe UI", sans-serif; }
  body.is-dark { --ink: #e2e2df; --muted: rgba(226, 226, 223, 0.55); --line: rgba(226, 226, 223, 0.16); --panel: rgba(30, 30, 32, 0.5); --head: rgba(29, 29, 31, 0.97); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #c9cbce; color: var(--ink); font-family: var(--sans); overflow: hidden; }
  body.is-dark { background: #1c1c1d; }
  .t4-scene { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  .t4 { position: fixed; inset: 0; pointer-events: none; font-family: var(--mono); }
  .t4 a, .t4 button, .t4 input, .t4-table, .t4-read, .t4-sub { pointer-events: auto; }
  /* THE CAMERA'S CORNERS, as image 5's */
  .t4-corner { position: absolute; width: 26px; height: 26px; border: 0 solid var(--ink); opacity: 0.8; }
  .t4-c1 { top: 22px; left: 22px; border-top-width: 2px; border-left-width: 2px; }
  .t4-c2 { top: 22px; right: 22px; border-top-width: 2px; border-right-width: 2px; }
  .t4-c3 { bottom: 22px; left: 22px; border-bottom-width: 2px; border-left-width: 2px; }
  .t4-c4 { bottom: 22px; right: 22px; border-bottom-width: 2px; border-right-width: 2px; }
  .t4-object { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); margin: 0; font: 400 13px var(--mono); letter-spacing: 0.08em; white-space: nowrap; text-align: center; }
  .t4-object h1 { display: inline; font: inherit; margin: 0; }
  .t4-stage { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); margin: 0; font: 400 13px var(--mono); letter-spacing: 0.08em; }
  .t4-total { position: absolute; bottom: 40px; right: 58px; margin: 0; font: 400 12px var(--mono); letter-spacing: 0.06em; }
  /* the dashed ring turning, bottom left */
  .t4-ring { position: absolute; left: 58px; bottom: 34px; width: 46px; height: 46px; border-radius: 50%; border: 2px dashed var(--ink); opacity: 0.7; animation: t4-turn 9s linear infinite; }
  .t4-ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1px solid var(--line); }
  @keyframes t4-turn { to { transform: rotate(360deg); } }
  /* THE WORD, down the left, letter by letter */
  .t4-read { position: absolute; left: 58px; top: 24%; width: 200px; font: 400 12px/1.55 var(--mono); }
  .t4-word { margin: 0 0 14px; font: 400 13px var(--mono); }
  .t4-at { margin: 0 0 14px; }
  .t4-letters { margin: 0; padding: 0; list-style: none; }
  .t4-letters li { display: grid; grid-template-columns: 22px 1fr; }
  .t4-letters b { font-weight: 400; }
  .t4-letters span { white-space: nowrap; }
  .t4-say { margin: 14px 0 0; font: 400 11px/1.5 var(--sans); color: var(--muted); }
  /* THE TABLE, on the right */
  .t4-table { position: absolute; top: 80px; right: 58px; bottom: 90px; width: 330px; display: flex; flex-direction: column; background: var(--panel); border: 0; border-left: 1px solid var(--line); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .t4-table-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .t4-table-head h2 { margin: 0 auto 0 0; font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
  .t4-find { width: 150px; padding: 5px 7px; font: 400 11px var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; outline: none; }
  .t4-find:focus { border-color: var(--ink); }
  .t4-table-toggle { display: none; }
  .t4-table-scroll { overflow: auto; flex: 1; }
  .t4-table table { width: 100%; border-collapse: collapse; font: 400 11px var(--mono); }
  .t4-table thead th { position: sticky; top: 0; z-index: 1; background: var(--head); text-align: left; font-weight: 500; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  .t4-table thead th[aria-sort="ascending"]::after { content: " ↑"; } .t4-table thead th[aria-sort="descending"]::after { content: " ↓"; }
  .t4-table td, .t4-table tbody th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; color: var(--muted); }
  .t4-table tbody th { color: var(--ink); }
  .t4-table td:nth-child(n+3) { text-align: right; }
  .t4-table tbody th button { font: 400 11.5px var(--sans); color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .t4-table tbody tr { cursor: pointer; }
  .t4-table tbody tr:hover { background: rgba(127, 127, 127, 0.12); }
  .t4-table tbody tr.is-on { background: var(--ink); }
  .t4-table tbody tr.is-on td, .t4-table tbody tr.is-on th button { color: #f0f0ee; }
  body.is-dark .t4-table tbody tr.is-on td, body.is-dark .t4-table tbody tr.is-on th button { color: #18181a; }
  /* its houses and their perfumes, under the table */
  .t4-sub { max-height: 44%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 12px 10px; }
  .t4-sub[hidden] { display: none; }
  .t4-sub-head { margin: 0 0 6px; font: 500 9.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .t4-sub ul { margin: 0; padding: 0; list-style: none; }
  .t4-sub ul ul { margin: 2px 0 6px 12px; padding-left: 8px; border-left: 1px solid var(--line); }
  .t4-sub button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 3px 0; font: 500 11.5px var(--sans); color: var(--ink); background: none; border: 0; text-align: left; cursor: pointer; }
  .t4-sub ul ul button { font: 400 11px var(--sans); }
  .t4-sub button.is-on { text-decoration: underline; text-underline-offset: 3px; }
  .t4-sub i { font: 400 10px var(--mono); font-style: normal; color: var(--muted); }
  /* THE WAYS: up, fit, the zoom, the ground, back */
  .t4-ways { position: absolute; top: 34px; right: 58px; display: flex; align-items: center; gap: 6px; font: 400 10.5px var(--mono); }
  .t4-ways button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); padding: 4px 8px; cursor: pointer; }
  .t4-ways button:hover { border-color: var(--ink); }
  .t4-ground button[aria-pressed="true"] { background: var(--ink); color: #eee; }
  body.is-dark .t4-ground button[aria-pressed="true"] { color: #18181a; }
  .t4-ground { display: flex; } .t4-ground button + button { border-left: 0; }
  .t4-zoom { min-width: 5ch; text-align: center; color: var(--muted); }
  .t4-back { position: absolute; top: 34px; left: 58px; font: 500 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  .t4-back:hover { color: var(--ink); }
  .t4-tip { position: absolute; left: 0; top: 0; max-width: 260px; padding: 7px 9px 8px; background: var(--panel); border: 1px solid var(--line); font: 400 11px/1.45 var(--sans); pointer-events: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .t4-tip[hidden] { display: none; }
  .t4-tip b { display: block; font: 600 12px var(--sans); }
  .t4-tip span { display: block; font: 400 10px var(--mono); color: var(--muted); }
  @media (max-width: 1100px) { .t4-read { display: none; } .t4-table { width: 290px; } }
  @media (max-width: 760px) {
    .t4-corner { width: 18px; height: 18px; }
    .t4-c1, .t4-c2 { top: 12px; } .t4-c1, .t4-c3 { left: 12px; } .t4-c2, .t4-c4 { right: 12px; } .t4-c3, .t4-c4 { bottom: 12px; }
    .t4-object { top: 54px; font-size: 10px; max-width: 86%; overflow: hidden; text-overflow: ellipsis; }
    .t4-back { top: 24px; left: 26px; }
    .t4-ways { top: 20px; right: 24px; gap: 4px; }
    .t4-zoom, .t4-fit { display: none; }
    .t4-stage { bottom: auto; top: calc(56% + 12px); font-size: 10.5px; }
    .t4-total { bottom: auto; top: calc(56% + 12px); right: 26px; font-size: 10px; }
    .t4-ring { display: none; }
    .t4-table { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; height: calc(44% - 40px); }
    .t4-table-toggle { display: inline-block; font: 400 10px var(--mono); color: var(--ink); background: none; border: 1px solid var(--line); padding: 4px 7px; }
    .t4-find { width: 120px; }
    .t4-table.is-open { height: 72%; }
    .t4-sub { max-height: 40%; }
  }
  @media (prefers-reduced-motion: reduce) { .t4-ring { animation: none; } }
</style>
</head>
<body>
<canvas class="t4-scene" aria-hidden="true"></canvas>
<main class="t4">
  <span class="t4-corner t4-c1" aria-hidden="true"></span><span class="t4-corner t4-c2" aria-hidden="true"></span>
  <span class="t4-corner t4-c3" aria-hidden="true"></span><span class="t4-corner t4-c4" aria-hidden="true"></span>
  <a class="t4-back" href="../../contact/">← Back</a>
  <div class="t4-object"><h1>OBJECT <span data-v="object">THE TASTE OF ALDEHYDES</span> <span data-v="quote">“PERFUMERS”</span></h1></div>
  <div class="t4-ways">
    <button type="button" class="t4-up" aria-label="Back up a level">↑ Up</button>
    <button type="button" class="t4-fit">Fit</button>
    <span class="t4-zoom">100%</span>
    <span class="t4-ground" role="group" aria-label="The ground"><button type="button" data-ground="grey" aria-pressed="true">Grey</button><button type="button" data-ground="dark" aria-pressed="false">Dark</button></span>
  </div>
  <section class="t4-read" aria-live="polite" aria-label="What is looked at"></section>
  <section class="t4-table" aria-label="The perfumers">
    <div class="t4-table-head"><h2>Perfumers</h2><input type="search" class="t4-find" placeholder="Find…" aria-label="Find a perfumer, a house or a perfume" autocomplete="off" spellcheck="false"><button type="button" class="t4-table-toggle" aria-expanded="false">More</button></div>
    <div class="t4-table-scroll">
      <table>
        <thead><tr><th scope="col">No.</th><th scope="col" data-sort="name" aria-sort="ascending">Perfumer</th><th scope="col" data-sort="houses" aria-sort="none">Houses</th><th scope="col" data-sort="perfumes" aria-sort="none">Perf.</th><th scope="col" data-sort="years" aria-sort="none">Years</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="t4-sub" hidden></div>
  </section>
  <span class="t4-ring" aria-hidden="true"></span>
  <p class="t4-stage" data-v="stage">STAGE 1: PERFUMERS</p>
  <p class="t4-total" data-v="total">TOTAL: 282</p>
  <div class="t4-tip" role="tooltip" hidden></div>
</main>
<script src="page.js?v=36ac6d4e36"></script>
</body>
</html>
