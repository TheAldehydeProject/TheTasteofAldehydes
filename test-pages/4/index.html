<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test page 4 — The Taste of Aldehydes</title>
<!-- SEARCH ENGINES: begin — what a search engine and a shared link show of this page. -->
<meta name="description" content="A test page, not a part of the site: The Network Map — every house, perfumer, perfume and note, on a board to draw on.">
<link rel="canonical" href="https://thetasteofaldehydes.com/test-pages/4/">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../favicon.svg?v=2026-10-05" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2026-10-05">
<meta name="theme-color" content="#101012">
<!-- SEARCH ENGINES: end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  TEST PAGE 4 (2026-11-02) — "4 should be modelled after image 4": the
  owner's picture of a whiteboard — a dense, many-coloured network of
  lines, circles and labelled boxes, a square frame through it, a few
  bees, and a toolbar along the foot (undo, redo, delete, duplicate; select,
  hand, pen, eraser, arrow, text, note, picture, circle).

  Here: the whole site as that network — every house, perfumer, perfume and
  note, joined as the Perfumers ledger and the notes join them — on a board
  where every tool on the toolbar works: draw on it, write on it, pin notes
  and pictures to it, move anything, rub it out, undo it. What is drawn is
  kept in this browser.

  NOT A PAGE OF THE SITE: reached only by the fourth of the four unseen
  squares at the foot of Contact; none of the site's scripts or its
  stylesheet, in no menu, search or sitemap, links to nothing of the site's
  but the way back, and search engines told to leave it alone.
-->
<style>
  :root {
    --ground: #101012;
    --ink: #ececee;
    --muted: #8b8b93;
    --panel: #1d1d21;
    --edge: rgba(255, 255, 255, 0.09);
    --blue: #4f7ff0;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Archivo", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); }
  .t4-board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .t4 { position: fixed; inset: 0; pointer-events: none; }
  .t4 > * { pointer-events: auto; }
  .t4-title { position: absolute; left: 18px; top: 14px; margin: 0; font: 600 13px var(--sans); letter-spacing: 0.02em; pointer-events: none; }
  .t4-title span { display: block; margin-top: 3px; font: 400 9.5px var(--mono); color: var(--muted); letter-spacing: 0.04em; }
  .t4-back { position: absolute; right: 18px; top: 14px; font: 500 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  .t4-back:hover { color: var(--ink); }

  /* the toolbar, two rows, along the foot */
  .t4-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .t4-row { display: flex; gap: 2px; padding: 5px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
  .t4-row-small { padding: 3px 4px; border-radius: 10px; }
  .t4-btn {
    position: relative; display: grid; place-items: center; width: 40px; height: 38px; padding: 0; border: 0; border-radius: 9px;
    color: #d8d8dd; background: none; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .t4-row-small .t4-btn { width: 32px; height: 30px; }
  .t4-btn:hover { background: rgba(255, 255, 255, 0.07); }
  .t4-btn.is-on { background: var(--blue); color: #fff; }
  .t4-btn:disabled { opacity: 0.35; cursor: default; background: none; }
  .t4-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .t4-btn kbd { position: absolute; right: 3px; bottom: 1px; font: 400 7px var(--mono); color: var(--muted); }
  .t4-btn.is-on kbd { color: rgba(255, 255, 255, 0.7); }
  .t4-pop {
    position: absolute; bottom: 108px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 5px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .t4-pop[hidden] { display: none; }
  .t4-menu { flex-direction: column; min-width: 190px; transform: translateX(-10%); }
  .t4-menu button { padding: 8px 12px; text-align: left; font: 400 12px var(--sans); color: var(--ink); background: none; border: 0; border-radius: 7px; cursor: pointer; }
  .t4-menu button:hover { background: rgba(255, 255, 255, 0.07); }
  .t4-colors { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; padding: 10px 8px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
  .t4-colors[hidden] { display: none; }
  .t4-colors button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .t4-colors button.is-on { border-color: #fff; box-shadow: 0 0 0 2px var(--blue); }
  .t4-zoom { position: absolute; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; font: 500 11px var(--mono); }
  .t4-zoom button { width: 28px; height: 26px; border: 0; border-radius: 7px; background: none; color: var(--ink); cursor: pointer; font: 500 15px var(--sans); }
  .t4-zoom button:hover { background: rgba(255, 255, 255, 0.07); }
  .t4-zoom span { min-width: 46px; text-align: center; color: var(--muted); }
  .t4-edit {
    position: absolute; min-width: 40px; padding: 2px 3px; outline: 1px dashed var(--blue); white-space: pre-wrap;
    font: 500 16px var(--sans); color: var(--ink); transform-origin: 0 0;
  }
  .t4-edit[hidden] { display: none; }
  .t4-tip { position: absolute; padding: 7px 10px 8px; font: 400 10.5px/1.5 var(--mono); color: var(--ink); background: rgba(22, 22, 26, 0.94); border: 1px solid var(--edge); border-radius: 6px; max-width: 260px; pointer-events: none; }
  .t4-tip b { display: block; font: 600 12px var(--sans); }
  .t4-tip[hidden] { display: none; }
  .t4-help { position: absolute; left: 18px; bottom: 18px; font: 400 9.5px/1.6 var(--mono); color: #5d5d66; pointer-events: none; }
  @media (max-width: 700px) {
    .t4-btn { width: 32px; height: 34px; }
    .t4-btn kbd { display: none; }
    .t4-row-small .t4-btn { width: 30px; }
    .t4-help, .t4-title span { display: none; }
    .t4-zoom { bottom: 112px; right: 10px; }
    .t4-colors { left: 8px; }
  }
</style>
</head>
<body>
<canvas class="t4-board" aria-label="A whiteboard with a network of the site's houses, perfumers, perfumes and notes" role="img"></canvas>
<main class="t4">
  <h1 class="t4-title">The Network Map <span>Test page 4 · every house, perfumer, perfume and note on the site</span></h1>
  <a class="t4-back" href="../../contact/">← Back</a>
  <div class="t4-edit" contenteditable="true" spellcheck="false" hidden></div>
  <input class="t4-file" type="file" accept="image/*" hidden>
  <div class="t4-colors" hidden aria-label="Colour"></div>
  <div class="t4-pop t4-shapes" hidden aria-label="More shapes"></div>
  <div class="t4-pop t4-menu" hidden aria-label="More"></div>
  <div class="t4-bar">
    <div class="t4-row t4-row-small" aria-label="Edit"></div>
    <div class="t4-row t4-row-tools" aria-label="Tools"></div>
  </div>
  <div class="t4-zoom"><button type="button" data-zoom="-1" aria-label="Zoom out">−</button><span>100%</span><button type="button" data-zoom="1" aria-label="Zoom in">+</button></div>
  <p class="t4-help">Wheel or pinch to zoom · space to pan · double-click a note or words to write in it</p>
  <div class="t4-tip" hidden></div>
</main>
<script src="page.js?v=159c76cd91"></script>
</body>
</html>
