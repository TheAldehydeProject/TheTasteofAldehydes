<!--
  TEST PAGE 1 — PERFUMER WORLDS (2026-11-06; "Worlds" stood here from
  2026-11-03, and "Skin, scanned" before it). The owner: "change test page 1
  to make it more into a perfumer oriented page ... you initially start with
  a diagram like this (image 2), and each dot or node on that when clicked
  will take you to a sphere (a menu identical to the one that currently
  occupies test pages 1). The central sphere node should be of the
  perfumer, and sphere nodes around it should be of the houses. You can
  click those and view the fragrances that were made by the perfumer for
  that house ... model it closer to image 4 ... a blur and a grain ... Make
  sure to have a return button." And then, seeing it: "remove the earth
  actually, make it way more abstract and blobby like in the image i
  referenced ... Add feathered borders, chromatic abberation and some other
  effects to actually try and recreate it as best as possible. No need to
  make 139 tiny nodes for prin lomoros. I want you to make the page look
  good."

  Image 2: on black, dots in blocks down both sides, every one a fine ray to
  one point low in the middle. Image 4: a pale poster — a title and a date
  over a heavy rule, one dark abstract blob in the middle and dark spheres
  out of focus round it, every edge feathered, a blue fringe above and a gold
  one below, a lavender haze, a thin double circle, three lines of text,
  grain.

  Since 2026-11-08, THE STRINGS and THE WORLD: a dot for every house a
  perfumer made for, a string from each to the point, slack and pulled taut
  under the hand; a block pressed opens its perfumer's world through three
  discs, a colour each; a house pressed in a world opens the house's own
  world, its perfumers round it — houses cut and ink, perfumers round and
  plum. The script says the rest.

  NOT A PAGE OF THE SITE: nothing on the site links here but the
  unseen squares at the foot of Contact; it loads none of the site's
  scripts or its stylesheet, is in no menu, search or sitemap, and tells
  search engines to leave it alone. Everything it needs is in this folder.
-->
<style>
  :root {
    --ground: #e6eae7;
    --ink: #1c1d22;
    --muted: #6d7177;
    --faint: #a3a8ab;
    --blue: #2f5bea;
    --gold: #d8a23a;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Archivo", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #050505; color: var(--ink); font-family: var(--sans); overflow: hidden; }
  body.is-world { background: var(--ground); }
  .t1-scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  /* the poster's grain: a picture of noise jumped about by its transform —
     over the world as the poster's is, and a breath of it over the rays */
  .t1-grain {
    position: fixed; inset: -60%; pointer-events: none; opacity: 0.1; mix-blend-mode: multiply;
    animation: t1-grain 1.1s steps(6) infinite; will-change: transform; transition: opacity 0.6s;
  }
  body.is-rays .t1-grain { opacity: 0.05; mix-blend-mode: screen; }
  @keyframes t1-grain {
    0% { transform: translate(0, 0); } 17% { transform: translate(-6%, 4%); } 33% { transform: translate(5%, -6%); }
    50% { transform: translate(-3%, 7%); } 67% { transform: translate(7%, 2%); } 83% { transform: translate(-5%, -5%); } 100% { transform: translate(0, 0); }
  }
  .t1 { position: fixed; inset: 0; pointer-events: none; }
  .t1 a, .t1 button, .t1 select, .t1 input, .t1-found { pointer-events: auto; }
  .t1-world-ui { transition: opacity 0.5s; }
  .t1-rays-ui { transition: opacity 0.5s; }
  body.is-rays .t1-world-ui { opacity: 0; visibility: hidden; }
  body.is-world .t1-rays-ui { opacity: 0; visibility: hidden; }
  /* the world's words come in with the world as it opens out of the strings,
     and go with it as it closes (2026-11-07; 2026-11-08) */
  body.is-revealing .t1-world-ui { visibility: visible; opacity: var(--reveal, 0); transition: none; }
  body.is-revealing .t1-rays-ui { visibility: visible; opacity: calc(1 - var(--reveal, 0)); transition: none; }

  /* THE RAYS' WORDS: white on the black */
  .t1-rays-head { position: absolute; top: 34px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: baseline; color: #f3f3f1; }
  .t1-rays-head h1 { margin: 0; font: 700 13px/1.2 var(--sans); letter-spacing: 0.01em; }
  .t1-rays-head h1 span { font-weight: 400; color: rgba(243, 243, 241, 0.5); }

  /* THE POSTER'S HEAD: a title and a date over a heavy rule */
  .t1-head { position: absolute; top: 36px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 3px solid #2a1d22; }
  .t1-head h2 { margin: 0; font: 700 13px/1.2 var(--sans); letter-spacing: 0.01em; }
  .t1-head h2 span { font-weight: 400; color: var(--muted); }

  /* THE READINGS, down the left, as the planet's */
  .t1-hud { position: absolute; left: 48px; top: 50%; transform: translateY(-46%); width: 250px; }
  .t1-read { margin: 0 0 24px; }
  .t1-read dt { position: relative; font: 400 12.5px var(--sans); color: #3c3f45; padding-bottom: 7px; }
  .t1-bar { position: relative; display: block; height: 1px; background: #2a2c31; margin-bottom: 9px; }
  .t1-read dd { margin: 0; font: 300 30px/1.1 var(--sans); letter-spacing: -0.01em; }
  .t1-read dd small { font: 400 13px var(--sans); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .t1-read .t1-world { font-size: 26px; font-weight: 400; overflow-wrap: anywhere; }
  .t1-kicker { display: block; margin-bottom: 4px; font: 500 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .t1-read .t1-sub { display: block; margin-top: 5px; font: 400 11px/1.4 var(--mono); color: var(--muted); letter-spacing: 0.02em; }
  .t1-gaugebox { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
  .t1-gauge { width: 68px; height: 68px; transform: rotate(135deg); flex: none; }
  .t1-gauge circle { fill: none; stroke-width: 6; }
  .t1-gauge .t1-gauge-bed { stroke: rgba(28, 29, 34, 0.08); stroke-dasharray: 75 100; }
  .t1-gauge .t1-gauge-arc { stroke: var(--blue); stroke-dasharray: 30 100; transition: stroke-dasharray 0.9s cubic-bezier(.2,.7,.2,1); }
  .t1-gauge .t1-gauge-arc2 { stroke: rgba(47, 91, 234, 0.35); stroke-dasharray: 0 30 10 100; transition: stroke-dasharray 0.9s cubic-bezier(.2,.7,.2,1); }
  .t1-shares { font: 400 11px/1.35 var(--mono); color: var(--muted); }
  .t1-shares p { margin: 0 0 3px; }
  .t1-shares b { font-weight: 500; color: var(--ink); margin-right: 6px; }

  /* THE LIST, on the right: its houses, or the perfumes made for the house */
  .t1-list { position: absolute; right: 48px; top: 112px; bottom: 128px; width: 280px; display: flex; flex-direction: column; pointer-events: auto; }
  .t1-list-head { margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid #2a2c31; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .t1-list-head span { font: 400 12.5px var(--sans); color: #3c3f45; }
  .t1-list-head b { font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .t1-list-how { margin: 0 0 6px; font: 400 10px var(--mono); color: var(--faint); letter-spacing: 0.03em; }
  .t1-list-rows { margin: 0; padding: 0 4px 0 0; list-style: none; overflow-y: auto; flex: 0 1 auto; min-height: 0; scrollbar-width: thin; scrollbar-color: rgba(28, 29, 34, 0.25) transparent;
    mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent); -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent); padding-bottom: 20px; }
  .t1-list-rows button { position: relative; width: 100%; display: grid; grid-template-columns: 2.6em 1fr auto; align-items: baseline; gap: 0 8px; padding: 7px 4px 8px 2px; background: none; border: 0; border-bottom: 1px solid rgba(28, 29, 34, 0.12); text-align: left; cursor: pointer; color: var(--ink); font: 400 13px/1.25 var(--sans); }
  .t1-list-rows button:hover, .t1-list-rows button:focus-visible, .t1-list-rows button.is-pinned, .t1-list-rows button.is-lit { background: rgba(255, 255, 255, 0.45); }
  .t1-list-rows button:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
  .t1-li-no { font: 500 10px var(--mono); color: var(--muted); letter-spacing: 0.06em; }
  .t1-li-name { min-width: 0; overflow-wrap: anywhere; }
  .t1-li-name small { display: block; margin-top: 2px; font: 400 10px var(--mono); color: var(--muted); letter-spacing: 0.02em; }
  .t1-li-n { font: 400 11px var(--mono); color: #3c3f45; }
  .t1-li-bar { position: absolute; left: 2.6em; bottom: -1px; height: 2px; background: var(--blue); opacity: 0.8; }
  .t1-li-mark { position: absolute; right: -2px; top: 11px; width: 5px; height: 5px; border-radius: 50%; border: 1px solid #2a2c31; }
  .t1-li-mark.t1-c0 { background: #2a2c31; }
  .t1-li-mark.t1-c1 { background: linear-gradient(90deg, #2a2c31 50%, transparent 50%); }
  .t1-list-rows .t1-li-n { margin-right: 8px; }

  /* LEARN MORE (2026-11-07; under the world since 2026-11-08, the three
     lines gone into the sheet — "make the button say 'Learn More about
     ________'"): the button, and the sheet it opens under the poster, which
     the page scrolls down to */
  .t1-more-open { position: absolute; bottom: 64px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px 10px; font: 500 11px var(--mono); letter-spacing: 0.04em; color: var(--ink); background: rgba(250, 251, 250, 0.55); border: 1px solid rgba(28, 29, 34, 0.3); cursor: pointer; white-space: nowrap; transition: border-color 0.4s, background 0.4s; }
  .t1-more-open:hover, .t1-more-open:focus-visible, .t1-more-open[aria-expanded="true"] { border-color: var(--ink); background: rgba(250, 251, 250, 0.9); }
  .t1-more-open[hidden] { display: none; }
  body.is-more { overflow-y: auto; }
  .t1-more { position: relative; z-index: 5; margin-top: 100vh; min-height: 100vh; background: var(--ground); border-top: 3px solid #2a1d22; box-shadow: 0 -30px 60px rgba(40, 45, 50, 0.12); }
  .t1-more[hidden] { display: none; }
  .t1-more-in { max-width: 760px; margin: 0 auto; padding: 46px 48px 90px; color: #2c2e33; animation: t1-up 0.9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes t1-up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .t1-more-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #2a2c31; }
  .t1-more-kicker { margin: 0; font: 500 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .t1-more-close { font: 500 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: none; border: 1px solid rgba(28, 29, 34, 0.3); padding: 6px 11px 7px; cursor: pointer; }
  .t1-more-close:hover { border-color: var(--ink); }
  .t1-more-name { margin: 34px 0 6px; font: 300 44px/1.05 var(--sans); letter-spacing: -0.01em; color: var(--ink); }
  .t1-more-sub { margin: 0 0 30px; font: 400 11px/1.4 var(--mono); color: var(--muted); letter-spacing: 0.02em; }
  .t1-more-lead p { margin: 0 0 14px; font: 400 18px/1.6 var(--sans); color: var(--ink); }
  .t1-more-h { margin: 38px 0 14px; padding-top: 14px; border-top: 1px solid rgba(28, 29, 34, 0.18); font: 500 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .t1-more-text p { margin: 0 0 16px; font: 400 15px/1.7 var(--sans); }
  .t1-more-group { margin: 0 0 18px; }
  .t1-more-who { margin: 0 0 6px; font: 500 14px var(--sans); color: var(--ink); }
  .t1-more-who span { margin-left: 6px; font: 400 10.5px var(--mono); color: var(--muted); }
  .t1-more-group ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 28px; }
  .t1-more-group li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid rgba(28, 29, 34, 0.1); font: 400 13px/1.35 var(--sans); break-inside: avoid; }
  .t1-more-group li span { font: 400 10.5px var(--mono); color: var(--muted); }
  .t1-more-src-head[hidden] { display: none; }
  .t1-more-src-head { margin: 40px 0 10px; padding-top: 14px; border-top: 1px solid rgba(28, 29, 34, 0.18); font: 500 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .t1-more-sources { margin: 0; padding: 0 0 0 1.6em; font: 400 11.5px/1.6 var(--sans); color: #3c3f45; }
  .t1-more-sources li { margin-bottom: 8px; padding-left: 4px; }
  .t1-more-sources cite { font-style: italic; }
  .t1-more-sources a { color: var(--blue); text-decoration: none; overflow-wrap: anywhere; font: 400 10.5px var(--mono); }
  .t1-more-sources a:hover { text-decoration: underline; }
  /* the readings come in softly when they change (2026-11-07) */
  .is-fresh { animation: t1-fresh 0.9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes t1-fresh { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (min-width: 761px) {
    .t1-hud.is-fresh { animation-name: t1-fresh-hud; }
    @keyframes t1-fresh-hud { from { opacity: 0; transform: translateY(-46%) translateX(-6px); } to { opacity: 1; transform: translateY(-46%); } }
  }
  .t1-list.is-fresh .t1-list-rows li { animation: t1-row 0.6s cubic-bezier(.2,.7,.2,1) both; }
  .t1-list.is-fresh .t1-list-rows li:nth-child(2) { animation-delay: 0.05s; }
  .t1-list.is-fresh .t1-list-rows li:nth-child(3) { animation-delay: 0.1s; }
  .t1-list.is-fresh .t1-list-rows li:nth-child(n+4) { animation-delay: 0.14s; }
  @keyframes t1-row { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* coming in (2026-11-07 — "make the loading of it smoother"): the words
     over the rays come up after the rays have begun, and nothing can be
     pressed until the page is ready */
  .t1-rays-ui { animation: t1-in 1.2s ease 0.5s both; }
  @keyframes t1-in { from { opacity: 0; } to { opacity: 1; } }
  body:not(.is-ready) .t1 a, body:not(.is-ready) .t1 button, body:not(.is-ready) .t1 select, body:not(.is-ready) .t1 input, body:not(.is-ready) .t1-list { pointer-events: none; }
  body:not(.is-ready) .t1-ways { opacity: 0.45; }
  .t1-ways { transition: opacity 0.6s; }
  /* THE SEARCH (2026-11-07): at the top right, on the rays and in the worlds —
     a field over a hairline that runs blue into gold as it is used, its
     answers coming down one after another, each saying what it is */
  .t1-find { position: absolute; top: 24px; right: 48px; width: 250px; z-index: 6; transition: width 0.5s cubic-bezier(.2,.7,.2,1); }
  .t1-find.is-open { width: 320px; }
  body.is-world .t1-find { right: 168px; top: 26px; }
  .t1-find-mark { position: absolute; left: 0; top: 9px; width: 11px; height: 11px; border: 1.3px solid currentColor; border-radius: 50%; cursor: pointer; color: rgba(243, 243, 241, 0.7); }
  .t1-find-mark::after { content: ""; position: absolute; left: 9px; top: 9px; width: 5px; height: 1.3px; background: currentColor; transform: rotate(45deg); transform-origin: 0 0; }
  body.is-world .t1-find-mark { color: var(--muted); }
  .t1-find input { width: 100%; box-sizing: border-box; padding: 6px 4px 7px 22px; font: 400 11px var(--mono); letter-spacing: 0.03em; color: #f3f3f1; background: transparent; border: 0; border-bottom: 1px solid rgba(243, 243, 241, 0.25); outline: none; border-radius: 0; }
  .t1-find input::placeholder { color: rgba(243, 243, 241, 0.45); }
  .t1-find input::-webkit-search-cancel-button { -webkit-appearance: none; }
  body.is-world .t1-find input { color: var(--ink); border-bottom-color: rgba(28, 29, 34, 0.3); }
  body.is-world .t1-find input::placeholder { color: var(--muted); }
  /* the lens's colours drawn along under it as it is used */
  .t1-find::after { content: ""; position: absolute; left: 0; right: 0; top: 30px; height: 1px; background: linear-gradient(90deg, #4a5cff, #b48cff 40%, #ffc450 75%, #ff5c40); transform: scaleX(0); transform-origin: 0 50%; transition: transform 0.7s cubic-bezier(.2,.7,.2,1); pointer-events: none; }
  .t1-find.is-open::after { transform: scaleX(1); }
  .t1-found { position: absolute; left: 0; right: 0; top: calc(100% + 8px); margin: 0; padding: 4px 0; list-style: none; background: rgba(10, 10, 12, 0.94); border: 1px solid rgba(255, 255, 255, 0.14); max-height: min(60vh, 420px); overflow-y: auto; }
  body.is-world .t1-found { background: rgba(250, 251, 250, 0.96); border-color: rgba(28, 29, 34, 0.16); box-shadow: 0 14px 34px rgba(30, 35, 40, 0.14); }
  .t1-found[hidden] { display: none; }
  .t1-found li { animation: t1-found-in 0.42s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 0.04s); }
  @keyframes t1-found-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .t1-found button { display: grid; grid-template-columns: 74px 1fr; gap: 1px 8px; width: 100%; padding: 7px 10px 8px; text-align: left; background: none; border: 0; cursor: pointer; color: #f3f3f1; }
  body.is-world .t1-found button { color: var(--ink); }
  .t1-found button b { grid-row: 1 / 3; font: 500 9px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(243, 243, 241, 0.5); padding-top: 3px; }
  body.is-world .t1-found button b { color: var(--muted); }
  .t1-found button span { font: 400 13px/1.25 var(--sans); }
  .t1-found button small { font: 400 10px var(--mono); color: rgba(243, 243, 241, 0.5); letter-spacing: 0.02em; }
  body.is-world .t1-found button small { color: var(--muted); }
  .t1-found button:hover, .t1-found button.is-at { background: rgba(255, 255, 255, 0.08); }
  body.is-world .t1-found button:hover, body.is-world .t1-found button.is-at { background: rgba(28, 29, 34, 0.06); }
  .t1-found button.is-at b { color: #ffc450; }
  body.is-world .t1-found button.is-at b { color: #b07a14; }
  .t1-found-none { padding: 9px 12px; font: 400 11px var(--mono); color: rgba(243, 243, 241, 0.55); }
  body.is-world .t1-found-none { color: var(--muted); }
  /* a house asked for, lit in the list a moment */
  .t1-list-rows button.is-found { animation: t1-lit 3.2s ease both; }
  @keyframes t1-lit { 0% { background: rgba(255, 196, 80, 0); } 15% { background: rgba(255, 196, 80, 0.32); } 100% { background: rgba(255, 196, 80, 0); } }
  /* the tip a perfume brings */
  .t1-tip { position: absolute; left: 0; top: 0; max-width: 290px; padding: 9px 11px 10px; background: rgba(250, 251, 250, 0.95); border: 1px solid rgba(28, 29, 34, 0.14); box-shadow: 0 10px 30px rgba(30, 35, 40, 0.12); font: 400 11px/1.45 var(--sans); color: #34363b; pointer-events: none; }
  body.is-rays .t1-tip { background: rgba(14, 14, 14, 0.92); border-color: rgba(255, 255, 255, 0.18); color: #d9d9d6; box-shadow: none; }
  .t1-tip[hidden] { display: none; }
  .t1-tip:not([hidden]) { animation: t1-tip-in 0.22s ease both; }
  @keyframes t1-tip-in { from { opacity: 0; } to { opacity: 1; } }
  .t1-tip b { display: block; font: 600 13px var(--sans); color: var(--ink); }
  body.is-rays .t1-tip b { color: #fff; }
  .t1-tip span { display: block; margin: 2px 0 3px; font: 400 10px var(--mono); color: var(--muted); }
  body.is-rays .t1-tip span { color: rgba(255, 255, 255, 0.55); }
  .t1-tip em { display: block; font-style: normal; }

  /* THE FOOT: back to Contact, RETURN a level, and the way through */
  .t1-back { position: absolute; left: 48px; bottom: 30px; font: 500 10.5px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(243, 243, 241, 0.55); text-decoration: none; }
  body.is-world .t1-back { color: var(--muted); }
  .t1-back:hover { color: #fff; }

<canvas class="t1-scene" aria-hidden="true"></canvas>
<div class="t1-grain" aria-hidden="true"></div>
<main class="t1">
  <div class="t1-rays-ui">
    <header class="t1-rays-head">
      <h1>Perfumer Worlds <span>· The Strings · every perfumer on The Taste of Aldehydes, a dot for each house they made for</span></h1>
    </header>
  </div>

  <div class="t1-world-ui">
    <header class="t1-head">
      <h2>Perfumer Worlds <span>· <span class="t1-head-name"></span></span></h2>
    </header>

    <section class="t1-hud" aria-label="The perfumer in focus" aria-live="polite">
      <dl class="t1-read t1-read-who">
        <dt><span class="t1-kicker" data-v="kicker"></span></dt>
        <dd class="t1-world"><span data-v="name"></span><span class="t1-sub" data-v="sub"></span></dd>
      </dl>
      <dl class="t1-read">
        <dt>Perfumes<span class="t1-bar"></span></dt>
        <dd><span data-v="count"></span></dd>
      </dl>
      <dl class="t1-read">
        <dt><span data-v="houses-say">Houses</span><span class="t1-bar"></span></dt>
        <dd><span data-v="houses"></span></dd>
      </dl>
    </section>

    <section class="t1-list" aria-label="What is in the world">
      <p class="t1-list-head"><span data-v="list-say">Its houses</span><b data-v="list-n"></b></p>
      <p class="t1-list-how" data-v="list-how"></p>
      <ol class="t1-list-rows"></ol>
    </section>
    <button type="button" class="t1-more-open" aria-expanded="false" aria-controls="t1-more" hidden>Learn More about <span data-v="more-who"></span> <span aria-hidden="true">↓</span></button>
    <button type="button" class="t1-return" hidden>↩ Return</button>
  </div>
  <div class="t1-tip" role="tooltip" hidden></div>
  <!-- THE SEARCH (2026-11-07): a perfumer, a house or a perfume, and on to the perfumer's world -->
  <div class="t1-find" role="search">
    <span class="t1-find-mark" aria-hidden="true"></span>
    <input type="search" placeholder="Find a perfumer, a house or a perfume" aria-label="Find a perfumer, a house or a perfume" autocomplete="off" spellcheck="false">
    <ul class="t1-found" hidden></ul>
  </div>

  <a class="t1-back" href="../../contact/">← Back</a>
  <nav class="t1-ways" aria-label="The perfumers">
    <button type="button" class="t1-prev" aria-label="The perfumer before">‹</button>
    <span class="t1-no" data-v="no"></span>
    <button type="button" class="t1-next" aria-label="The next perfumer">›</button>
    <select class="t1-pick" aria-label="Every perfumer"></select>
  </nav>
</main>

    <div class="t1-more-text"></div>
    <div class="t1-more-made"></div>
    <h3 class="t1-more-src-head">Sources</h3>
    <ol class="t1-more-sources"></ol>
  </div>
</section>
