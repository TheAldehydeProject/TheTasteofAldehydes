<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.85 -1.2 2.2 2.4">
  <!-- The site's icon: formaldehyde, H2C=O — THE OWNER'S OWN DRAWING
       (2026-10-05, last: "use these for the favicon; but if possible make
       them red"), the H, C and O as letters, the two hydrogens up and down
       on the left, the double bond to the O on the right. Their file, drawn
       as their two pictures show it, and turned red: the same hue as the
       site's red (#ff3a44) at the saturation and lightness of their two
       blues — #eb252f where theirs was #2563eb, and in a dark browser
       #ff9398 where theirs was #93b4ff. Their letters were Arial Bold,
       outlined by the lines' own stroke (0.09) as a browser drew them, which
       is what made them as heavy as their pictures; here they are that
       letter's own outline (Liberation Sans Bold, Arial's shapes and widths),
       placed where a browser set theirs — centred on each atom, as
       `text-anchor: middle` and `dominant-baseline: central` do — and
       stroked the same, so every computer draws the same icon without
       needing the font, and it lands within a fraction of a pixel of their
       picture. No square behind it, as theirs had none. (Until then it was
       a skeletal formula in a red glow on a black square, and before that
       R–C(=O)–H in letters; both are in the history of this file.) -->
  <style>
    .ink { stroke: #eb252f; fill: #eb252f; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #ff9398; fill: #ff9398; } }
  </style>
