<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The site's icon: an aldehyde, R–C(=O)–H, drawn as a chemistry book
       draws one (the owner, 2026-09-27: "do the favicon from scratch and make
       it look like a proper chemistry thing: something you would find in a
       nice and neat chemistry book"). Set the way the figures in modern
       textbooks are set (ChemDraw's ACS style): the letters are real Arial
       letters (Liberation Sans, which has Arial's shapes and widths), turned
       into outlines so they look the same on every computer; each letter is
       centred on its atom; the bonds are as thick as the letters' strokes and
       stop the same small margin short of every letter; the C=O double bond
       is two even lines either side of the axis; and R and H stand at 120
       degrees below the carbon, as a carbonyl carbon's three bonds do. Only
       one liberty: the letters and bonds are a little heavier than a book's,
       by the same amount, so the figure still reads at a tab's 16 pixels.
       Worked out by a script from the font, not placed by eye. -->
  <rect width="48" height="48" rx="3" fill="#fff"/>
  <path d="M22.02 22.67L22.02 14.98 M26.21 22.67L26.21 14.98 M17.99 32.84L11.84 36.39 M30.25 32.84L36.63 36.53" fill="none" stroke="#000" stroke-width="1.85" stroke-linecap="butt"/>
