<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The site's icon: an aldehyde, drawn by hand — R–C(=O)–H, the O on
       top on its double bond, black on white (the owner, 2026-09-26).
       Every letter is a pen stroke, a little uneven, not type. -->
  <rect width="48" height="48" rx="6" fill="#ffffff"/>
  <g transform="translate(0 4)" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- O -->
    <path d="M26.4 4.6c-2.2-1.3-5.4-.5-6.2 2.4-.9 3.1.6 6.8 3.7 7.1 3.1.3 5-2.6 4.6-5.7-.2-1.9-1.1-3.3-2.6-4.1-.6-.3-1.2-.4-1.8-.4"/>
    <!-- the double bond -->
    <path d="M22 16.4c.2 2.4-.1 4.7.1 7.2"/>
    <path d="M26.3 16.2c-.1 2.5.2 4.9 0 7.4"/>
    <!-- C -->
    <path d="M28.4 27.6c-1.2-1.6-3.6-2.2-5.5-1.2-2.3 1.2-3 4.4-1.9 6.7 1.1 2.4 4.2 3.1 6.6 1.6.5-.3.9-.7 1.2-1.1"/>
    <!-- R, and its bond -->
    <path d="M4.7 36.3c.1-3.4-.1-6.7.1-10 2.3-.4 4.9-.2 5.8 1.6.8 1.7-.6 3.5-2.6 3.8-1.1.2-2.2.1-3.2.1"/>
    <path d="M7.9 31.6c1.1 1.5 2.2 3.1 3.4 4.6"/>
    <path d="M13.2 30.9c1.9.2 3.8-.1 5.6.1"/>
    <!-- the bond, and H -->
    <path d="M30.7 31.1c1.8-.1 3.7.2 5.5 0"/>
    <path d="M38.6 26.2c.2 3.4-.1 6.8.1 10.1"/>
    <path d="M44.4 26c-.1 3.5.2 6.9 0 10.4"/>
    <path d="M38.8 31.3c1.9-.2 3.8.1 5.6-.1"/>
  </g>
</svg>
