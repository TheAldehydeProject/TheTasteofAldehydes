<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — The Taste of Aldehydes</title>
<!-- SEARCH ENGINES: begin — what a search engine and a shared link show of this page. -->
<meta name="description" content="Search The Taste of Aldehydes: every house, fragrance, note and piece of writing on the site.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fafaf9">
<!-- SEARCH ENGINES: end -->
<!--
  THIS PAGE MOVED, AND THIS IS THE SIGNPOST LEFT WHERE IT STOOD.

  Every page in the Menu lives at an address of its own name since
  2026-10-01 — the owner: "I want the page to be thetasteofaldehydes.com/x
  where x is the name of the thing on the menu" — so this one is at
  /search/. Anything already linked or bookmarked at the old address
  still has to work, so the old address keeps a page like this one.

  IT FORWARDS THREE WAYS, and it needs all three:

    THE SCRIPT   goes at once AND CARRIES THE QUERY AND THE ANCHOR with it
                 (a house's way back is `#house-08`, a search `?q=`); a
                 meta refresh drops them. `replace` rather than `assign`,
                 so the back button steps over this page.
    THE META     the fallback with no JavaScript.
    THE LINK     for anyone who has both turned off.

  Nothing else is on the page: it is a signpost, not a page.
-->
<link rel="canonical" href="search/">
<meta name="robots" content="noindex">
<script>location.replace("search/" + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=search/">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page-content">
  <h1>Search has moved</h1>
  <p class="category-lede">This page now lives at
    <a href="search/">/search/</a>. You should be taken there automatically.</p>
</main>
</body>
</html>
