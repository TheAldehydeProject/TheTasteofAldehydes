<!--
  THE TEST PAGE. The owner, 2026-09-26: "add a new page to the whole
  site, and make it completly blank. this will be a test page." It
  carried a network of red nodes, then five of them; and since
  2026-09-27 it is THE NOTE LIBRARY AS NETWORKS: one dense red network of
  every note, which comes apart into a network for each accord, joined to
  a centre — "I want each galaxy to be an accord, and then the dots on it
  should be the individual notes", and then "IN REALITY I WANT THEM TO BE
  COMPLEX NETWORKS WITH CONNECTIONS AND GEOMETRICS".

  NOTHING ABOUT THE LIBRARY IS WRITTEN HERE. network.js reads the Note
  Library's own page (categories/note-library.html) as this one opens —
  every accord, every note, what it is — and notes-data.js for how many
  fragrances use each, so a note added to the library is here at once.
  The nodes that stand for nothing (the fillers) are made up by the
  script.

  What network.js draws and adds: the one red network, wiring itself in
  as the page opens; the button at the foot that expands it; the dropdown
  that goes from one accord to another; the two arrows on the left, which
  pull out the search bar (query>) and the menu (the accords); and, since
  2026-09-28, a window for every note — its own version of the library,
  the rest of the page out of focus behind it — with a figure of what the
  note is of in red particles, drawn by note-figures.js; and COMBINATIONS,
  the button beside the one that expands it.
-->
<main class="net-stage" aria-label="The Note Library as networks: every note a glowing red node in one network that expands into a network for each accord, joined to a centre. Drag to turn it; once expanded, press a note to read it.">
  <h1 class="visually-hidden">Test page — the Note Library as networks</h1>
  <canvas class="net-canvas" aria-hidden="true"></canvas>
  <p class="net-hint" aria-hidden="true">Drag to turn it any way · scroll to come closer · expand it, then press a note to read it · the search and the menu are on the left</p>
  <p class="net-fallback" hidden>The library could not be drawn here.</p>
</main>
