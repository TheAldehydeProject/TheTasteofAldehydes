<!--
  THE TEST PAGE. The owner, 2026-09-26: "add a new page to the whole
  site, and make it completly blank. this will be a test page." It
  carried a network of red nodes, then five of them; and since
  2026-09-27, at their word, it is THE NOTE LIBRARY IN THREE DIMENSIONS:
  "I want each galaxy to be an accord, and then the dots on it should be
  the individual notes that belong to that accord group."

  NOTHING ABOUT THE LIBRARY IS WRITTEN HERE. network.js reads the Note
  Library's own page (categories/note-library.html) as this one opens —
  every accord, every note, what it is — and notes-data.js for how many
  fragrances use each, so a note added to the library is here at once.

  What network.js draws and adds: one red galaxy of every note; the
  button at the foot that expands it into a galaxy for each accord,
  joined to a centre; the dropdown that goes from one to another; the
  window on the right with the search bar's switch and the accords; and
  the card a note is read in.
-->
<main class="net-stage" aria-label="The Note Library in three dimensions: every note a glowing node, in one red galaxy that expands into a galaxy for each accord, joined to a centre. Drag to turn it, press a note to read it.">
  <h1 class="visually-hidden">Test page — the Note Library in three dimensions</h1>
  <canvas class="net-canvas" aria-hidden="true"></canvas>
  <p class="net-hint" aria-hidden="true">Drag to turn it any way · scroll to come closer · press a note to read it</p>
  <p class="net-fallback" hidden>The library could not be drawn here.</p>
</main>
