<!--
  CONTACT. The owner, 2026-09-24: "remove the email and remove
  everything. Get in touch, send a carrier pigeon. put that instead".
  So that sentence stands at the head of the page.

  AND UNDER IT, THE DETAILS BEHIND A CAPTCHA — the owner, 2026-09-26:
  "in contact, add a captcha that hides the contact information (let it
  be filer contact information)". contact.js draws a few characters in
  specks; typed back, they show the details. Then, the same night: "for
  the contact information, keep this: Get in touch, send a carrier
  pigeon. Below it add :or just send an email: and there add the stuff
  that i told you to" — so the owner's "or just send an email:" stands
  under the sentence, as the head of the captcha, and the one detail it
  shows is the (filler) email. On 2026-09-29 the line became "... or an
  email:", at the owner's word ('rewrite "or just send an email:" to "...
  or an email:"').

  THE DETAILS ARE FILLER, and they are NOT written in this page in the
  clear — so that a program reading pages for addresses finds none. They
  are in `data-sealed` below, scrambled; contact.js unscrambles them
  once the characters are typed. To change them, the details are a list
  of [label, what it says, link or ""], written as JSON, each character
  XORed with the word "aldehydes" in turn, then base64 — the same steps
  contact.js takes backwards (`unseal`).
-->
<main class="page-content contact-page">
  <h1>Get in touch, send a carrier pigeon.</h1>

  <section class="contact-lock" aria-labelledby="contact-lock-name"
           data-sealed="OjdGIAUYDQlRTU4MAAQVCyUWGQ0JFQQcSgYcDE5IRwUYDQkHDlYMAAQVCyUWGQ0JFQQcSgYcDE45OA==">
    <p class="contact-or" id="contact-lock-name">... or an email:</p>
    <form class="contact-check" hidden>
      <div class="contact-captcha">
        <canvas class="contact-captcha-canvas" role="img" aria-label="Characters drawn in specks, to type into the box below"></canvas>
        <button class="contact-captcha-new" type="button" aria-label="Draw new characters">New characters</button>
      </div>
      <label class="contact-captcha-label" for="contact-captcha-field">Type the characters above</label>
      <div class="contact-captcha-row">
        <input class="contact-captcha-field" id="contact-captcha-field" type="text" autocomplete="off"
               autocapitalize="characters" spellcheck="false" maxlength="10">
        <button class="contact-captcha-go" type="submit">Show the email</button>
      </div>
      <p class="contact-captcha-say" aria-live="polite"></p>
    </form>
    <dl class="contact-details" hidden></dl>
    <p class="contact-lock-nojs">The email is shown once a short check is passed, and the check needs JavaScript.</p>
  </section>
</main>

</body>
